version: '3.8'

services:
  # 1. Unified Full-Stack Application Service (Express + React 19)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_pesantren_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://localhost:3000
      - JWT_SECRET=super-secret-jwt-key-for-erp-platform-2026
      - DATABASE_URL=mysql://erp_user:secure_password_992@mysql:3306/erp_pesantren_db
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minio_admin_key
      - MINIO_SECRET_KEY=minio_secret_key_12345
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Relational Database Engine (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: erp_pesantren_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_abc
      MYSQL_DATABASE: erp_pesantren_db
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: secure_password_992
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Cache & Message Queue Backend (Redis Store)
  redis:
    image: redis:alpine
    container_name: erp_pesantren_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: erp_pesantren_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin_key
      MINIO_ROOT_PASSWORD: minio_secret_key_12345
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Reverse Proxy & API Gateway (Nginx Router)
  nginx:
    image: nginx:alpine
    container_name: erp_pesantren_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
