name: Enterprise ERP Pesantren - CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev, sprint-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------
  # Job 1: Lint, Test & Compile build artifacts
  # ---------------------------------------------------------
  build-and-test:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    services:
      # Optional: Spin up MySQL and Redis services for full integration test compliance
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secure_password_abc
          MYSQL_DATABASE: erp_pesantren_db_test
          MYSQL_USER: erp_user
          MYSQL_PASSWORD: secure_password_992
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Validate environment variables (.env.example)
        run: |
          if [ ! -f .env.example ]; then
            echo "❌ .env.example file is missing!"
            exit 1
          fi
          echo "✓ .env.example file validated successfully"

      - name: Static Analysis & Code Quality (ESLint / TS Checking)
        run: npm run lint

      - name: Execute Automated Unit & Integration Tests
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-12345
          DATABASE_URL: mysql://erp_user:secure_password_992@127.0.0.1:3306/erp_pesantren_db_test
          REDIS_URL: redis://127.0.0.1:6379
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: 9000

      - name: Build Full-Stack Production Artifacts (Vite + Express Bundle)
        run: npm run build

  # ---------------------------------------------------------
  # Job 2: Validate Docker Image Packaging Compliance
  # ---------------------------------------------------------
  docker-validation:
    name: Verify Container Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: erp-pesantren:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
