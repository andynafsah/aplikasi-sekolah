<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <g filter="url(#shadow)">
    <!-- Shield / Emblem Container -->
    <path d="M256 70 L380 120 V250 C380 340 320 405 256 440 C192 405 132 340 132 250 V120 Z" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

    <!-- Inner Graduation Cap / Book Symbol -->
    <path d="M256 160 L330 200 L256 240 L182 200 Z" fill="url(#goldGrad)"/>
    <path d="M330 200 V235 C330 235 300 255 256 255 C212 255 182 235 182 235 V200" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Tassel -->
    <path d="M305 214 V265 M300 265 H310" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>

    <!-- Open Book / Crescent Motif -->
    <path d="M200 290 C225 280 245 290 256 295 C267 290 287 280 312 290 V340 C287 330 267 340 256 345 C245 340 225 330 200 340 Z" fill="url(#emeraldGrad)"/>
    <line x1="256" y1="295" x2="256" y2="345" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

    <!-- Star Emblem at Top -->
    <circle cx="256" cy="120" r="12" fill="#fef08a"/>
  </g>

  <!-- App Title Overlay text -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">ERP SEKOLAH</text>
  <text x="256" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ENTERPRISE PWA</text>
</svg>
